[package]
name = "blue-onyx-prism"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Blue Iris compatible object detection service on OpenVINO and ONNX Runtime, with hardware-based device selection"
repository = "https://github.com/patrickgods1/blue-onyx-prism"
default-run = "blue-onyx-prism"

[lib]
name = "blue_onyx_prism"
path = "src/lib.rs"

[[bin]]
name = "blue-onyx-prism"
path = "src/bin/blue_onyx_prism.rs"

[[bin]]
name = "blue-onyx-prism-service"
path = "src/bin/blue_onyx_prism_service.rs"

[[bin]]
name = "blue-onyx-prism-benchmark"
path = "src/bin/blue_onyx_prism_benchmark.rs"

[[bin]]
name = "test-blue-onyx-prism"
path = "src/bin/test_blue_onyx_prism.rs"

[features]
default = ["onnxruntime"]
# ONNX Runtime backend (CUDA, TensorRT, DirectML, CoreML, CPU execution providers).
onnxruntime = ["dep:ort"]

[dependencies]
openvino = { version = "0.11", features = ["runtime-linking"] }
anyhow = "1"
thiserror = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio", "query", "form"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
crossbeam-channel = "0.5"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
mime = "0.3"
fast_image_resize = { version = "6", features = ["image"] }
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = { version = "0.7", features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
ab_glyph = "0.2"
hf-hub = { version = "1", default-features = false, features = ["rustls-tls", "blocking"] }
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "multipart", "stream", "http2"] }
futures-util = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
num_cpus = "1"
base64 = "0.22"
# Same major as openvino-sys's runtime-linking dependency; used to preload libtbb/libopenvino
# (Unix) and to probe the ONNX Runtime / CUDA libraries.
libloading = "0.8"
# ONNX Runtime (feature `onnxruntime`): the shared library is loaded at runtime (`load-dynamic`),
# so nothing is linked or downloaded at build time. All `ort` code lives in src/backend/ort.rs.
# No `api-NN` feature: any ONNX Runtime 1.17+ library loads (`setup-onnxruntime` pins 1.24.4).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "tracing", "cuda", "tensorrt", "directml", "coreml"] }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tracing-layer-win-eventlog = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }

[dev-dependencies]
approx = "0.5"
# Router tests (`ServiceExt::oneshot`); already a transitive dependency of axum.
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
