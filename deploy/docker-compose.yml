services:
  blue-onyx-prism:
    image: blue-onyx-prism:latest
    build:
      context: ..
    container_name: blue-onyx-prism
    restart: unless-stopped
    ports:
      - "32168:32168"
    devices:
      - /dev/dri:/dev/dri
    # Numeric GID of the host's `render` group (`getent group render | cut -d: -f3`); group names
    # do not resolve inside the container.
    group_add:
      - "${RENDER_GID:-109}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./models:/app/models
      - ./cache:/app/cache
      - ./config:/app/config
