name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests (no OpenVINO needed)
        run: cargo test
        env:
          BLUE_ONYX_SKIP_OPENVINO_TESTS: "1"
      - name: Build release
        run: cargo build --release
      - name: Fetch OpenVINO runtime
        run: cargo run --release -- setup-openvino --dest target/release/openvino
      - name: Download smallest model
        run: cargo run --release -- download-models --name ipcam-bird --dir target/release/models
      - name: Smoke test (CPU)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/blue-onyx-openvino
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --model target/release/models/ipcam-bird.onnx --family yolo5 --force-cpu --port 32168 --cache-dir target/release/cache &
          PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:32168/ >/dev/null; then break; fi; sleep 2
          done
          curl -sf -o /tmp/dog.jpg https://raw.githubusercontent.com/xnorpx/blue-onyx/main/assets/dog_bike_car.jpg
          for i in $(seq 1 60); do
            OUT=$(curl -s -F image=@/tmp/dog.jpg -F min_confidence=0.2 http://127.0.0.1:32168/v1/vision/detection || true)
            echo "$OUT" | grep -q '"success":true' && break
            sleep 2
          done
          echo "$OUT"
          echo "$OUT" | grep -q '"success":true'
          kill $PID || true
