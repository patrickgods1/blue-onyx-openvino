name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests (no OpenVINO needed)
        run: cargo test
        env:
          BLUE_ONYX_SKIP_OPENVINO_TESTS: "1"
      - name: Build release (all binaries)
        run: cargo build --release --bins
      - name: Fetch OpenVINO runtime
        run: cargo run --release -- setup-openvino --dest target/release/openvino
      - name: Download smallest model
        run: cargo run --release -- download-models --name ipcam-bird --dir target/release/models
      - name: Smoke test (CPU)
        shell: bash
        run: |
          set -euo pipefail
          EXE=""
          case "$RUNNER_OS" in Windows) EXE=".exe";; esac
          BIN="target/release/blue-onyx-prism$EXE"
          CLIENT="target/release/test-blue-onyx-prism$EXE"
          LOG="$RUNNER_TEMP/blue-onyx-server.log"
          IMG=tests/data/dog_bike_car.jpg
          URL=http://127.0.0.1:32168

          "$BIN" --config "$RUNNER_TEMP/smoke_config.json" \
            --model target/release/models/ipcam-bird.onnx --family yolo5 --force-cpu \
            --port 32168 --cache-dir target/release/cache >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            if [ "$RUNNER_OS" = "Windows" ]; then
              taskkill //F //IM blue-onyx-prism.exe >/dev/null 2>&1 || true
            fi
            echo "---- server log ----"; tail -n 50 "$LOG" || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            curl -sf "$URL/" >/dev/null && break
            sleep 2
          done

          OUT=""
          for i in $(seq 1 60); do
            OUT=$(curl -s -F image=@"$IMG" -F min_confidence=0.2 "$URL/v1/vision/detection" || true)
            echo "$OUT" | grep -q '"success":true' && break
            sleep 2
          done
          echo "detection: $OUT"
          echo "$OUT" | grep -q '"success":true'

          LIST=$(curl -s -X POST "$URL/v1/vision/custom/list")
          echo "list: $LIST"
          echo "$LIST" | grep -q 'ipcam-bird'

          OUT=$(curl -s -F image=@"$IMG" -F min_confidence=0.2 "$URL/v1/vision/custom/ipcam-bird")
          echo "custom: $OUT"
          echo "$OUT" | grep -q '"success":true'

          "$CLIENT" --repeat 5 --parallel 2
          "$CLIENT" --model ipcam-bird --repeat 3
          "$CLIENT" --list
